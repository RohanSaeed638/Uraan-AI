<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a5e"/>
      <stop offset="0.5" stop-color="#1a1040"/>
      <stop offset="1" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4fd6"/>
      <stop offset="1" stop-color="#3a2680"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d3399"/>
      <stop offset="1" stop-color="#241760"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c1c6b"/>
      <stop offset="1" stop-color="#160f3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd980" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd980" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="80" r="1.6" opacity="0.9"/>
    <circle cx="140" cy="140" r="1.2" opacity="0.7"/>
    <circle cx="220" cy="60" r="1.8" opacity="0.8"/>
    <circle cx="320" cy="120" r="1.3" opacity="0.6"/>
    <circle cx="400" cy="70" r="1.5" opacity="0.9"/>
    <circle cx="480" cy="150" r="1.2" opacity="0.7"/>
    <circle cx="540" cy="90" r="1.7" opacity="0.85"/>
    <circle cx="90" cy="220" r="1.1" opacity="0.5"/>
    <circle cx="250" cy="180" r="1.4" opacity="0.7"/>
    <circle cx="380" cy="200" r="1.1" opacity="0.55"/>
    <circle cx="520" cy="230" r="1.3" opacity="0.6"/>
    <circle cx="30" cy="160" r="1.2" opacity="0.6"/>
    <circle cx="180" cy="100" r="1.0" opacity="0.5"/>
  </g>

  <!-- moon glow -->
  <circle cx="440" cy="150" r="120" fill="url(#glow)"/>
  <circle cx="440" cy="150" r="34" fill="#ffe9b8"/>

  <!-- back mountain range -->
  <path d="M0 480 L80 380 L160 460 L230 360 L300 450 L380 340 L460 440 L540 380 L600 460 L600 800 L0 800 Z" fill="url(#m3)"/>

  <!-- mid mountain range -->
  <path d="M0 560 L100 420 L190 520 L280 400 L340 480 L420 380 L500 500 L600 420 L600 800 L0 800 Z" fill="url(#m2)"/>

  <!-- front mountain (hero peak, off-center) -->
  <path d="M-20 700 L160 300 L230 430 L300 340 L420 620 L520 480 L640 700 L640 800 L-20 800 Z" fill="url(#m1)"/>

  <!-- snow cap accent on hero peak -->
  <path d="M160 300 L200 356 L160 340 L120 356 Z" fill="#ffffff" opacity="0.8"/>

  <!-- warm horizon glow -->
  <rect x="0" y="560" width="600" height="240" fill="url(#horizonGlow)"/>

  <!-- tiny flag at the summit -->
  <line x1="160" y1="300" x2="160" y2="265" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M160 265 L192 275 L160 285 Z" fill="#ffcf5c"/>
</svg>
