name: Check learning links

# Once a week: re-checks the resource library and the links inside learners' roadmaps, takes dead ones out
# (a task left with none gets a search for its topic), and switches off library resources that stay dead.
# Use this OR a cron job on the API host running `python -m app.workers.check_links`, not both.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # Only runs once the repository has the secrets below.
    if: ${{ vars.REMINDERS_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_NAME: Uraan AI
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.workers.check_links
