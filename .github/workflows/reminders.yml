name: Send reminders

# GitHub's scheduler can run a few minutes late and skips runs under load, which is
# fine here (each reminder is sent at most once a day). If the API is hosted on
# Railway or Render, a cron job there running `python -m app.workers.send_reminders`
# is steadier; use one or the other, not both.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    # Only runs once the repository has the secrets below.
    if: ${{ vars.REMINDERS_ENABLED == 'true' }}
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_NAME: Uraan AI
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      WEB_URL: ${{ secrets.WEB_URL }}
      API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m app.workers.send_reminders
